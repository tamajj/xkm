name: Build

on:
  push:
    branches: [ "claude/**", "master", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore XboxKeyboardMouse.sln

      - name: Build (Release)
        run: msbuild XboxKeyboardMouse.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: XboxKeyboardMouse
          path: |
            XboxKeyboardMouse/bin/Release/*.exe
            XboxKeyboardMouse/bin/Release/*.dll
            XboxKeyboardMouse/bin/Release/*.config
          if-no-files-found: error
